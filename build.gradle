plugins {
    id 'com.android.application' version '9.4.1' apply false
}

allprojects {
    version = '1.0'
    ext {
        appName = 'CollectTheOrbs'
        gdxVersion = '1.14.2'
    }
    repositories {
        mavenCentral()
        google()
    }
}

subprojects {
    plugins.withId('java') {
        java {
            sourceCompatibility = JavaVersion.VERSION_11
            targetCompatibility = JavaVersion.VERSION_11
        }
        compileJava.options.encoding = 'ISO-8859-1'
        sourceSets.main.java.srcDirs = ['src/']
    }
}

project(':core') {
    apply plugin: 'java-library'
    dependencies {
        api fileTree(dir: '../libs', include: 'tween-engine-api.jar')
        api fileTree(dir: 'libs', include: '*.jar')
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    }
}

project(':desktop') {
    apply plugin: 'application'
    dependencies {
        implementation project(':core')
        implementation fileTree(dir: 'libs', include: 'gdx-sqlite-desktop.jar')
        implementation 'org.xerial:sqlite-jdbc:3.46.1.3'
        implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
        implementation "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop"
    }
    application {
        mainClass = 'com.spaceship.main.desktop.DesktopLauncher'
        applicationDefaultJvmArgs = ['-XstartOnFirstThread']
    }
    tasks.named('run') {
        workingDir = file('../android/assets')
        standardInput = System.in
    }
}
