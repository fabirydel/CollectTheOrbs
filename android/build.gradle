apply plugin: 'com.android.application'

configurations { natives }

def signingProps = new Properties()
def signingFile = new File(System.getProperty('user.home'), '.collect-the-orbs-signing/keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }

android {
    namespace 'com.spaceship.main.android'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fabirydel.collecttheorbs'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '2.0.5'
        manifestPlaceholders = [appLabel: '@string/app_name', admobAppId: 'ca-app-pub-6364399383456402~4696765155']
        resValue 'string', 'admob_interstitial_id', 'ca-app-pub-6364399383456402/9451106223'
    }

    buildFeatures {
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    signingConfigs {
        if (signingFile.exists()) {
            upload {
                storeFile file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // installs next to the Play Store build instead of clashing with its signature
            applicationIdSuffix '.debug'
            // debug builds use Google's test ads: never show (or tap) real ads while developing
            manifestPlaceholders = [appLabel: 'Orbs (dev)', admobAppId: 'ca-app-pub-3940256099942544~3347511713']
            resValue 'string', 'admob_interstitial_id', 'ca-app-pub-3940256099942544/1033173712'
        }
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.upload
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    implementation "com.google.android.gms:play-services-ads:23.6.0"
    implementation "com.android.billingclient:billing:8.0.0"
    implementation "com.google.android.gms:play-services-games-v2:20.1.2"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
}

// Extracts the libGDX native .so files from the natives configuration into libs/<abi>/
tasks.register('copyAndroidNatives') {
    doFirst {
        ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].each { abi ->
            file("libs/$abi/").mkdirs()
        }
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('libs/armeabi-v7a')
            if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
            if (jar.name.endsWith('natives-x86_64.jar')) outputDir = file('libs/x86_64')
            else if (jar.name.endsWith('natives-x86.jar')) outputDir = file('libs/x86')
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.contains('JniLibFolders')) {
        task.dependsOn 'copyAndroidNatives'
    }
}
